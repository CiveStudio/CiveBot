<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 780" font-family="system-ui, 'Microsoft YaHei', 'PingFang SC', sans-serif">
  <rect width="1100" height="780" fill="#ffffff"/>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="8" refX="8" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L9,3 L0,6 Z" fill="#555555"/>
    </marker>
  </defs>

  <!-- QQ -->
  <rect x="440" y="20" width="220" height="60" rx="8" fill="#ECECFF" stroke="#9370DB" stroke-width="1.5"/>
  <text x="550" y="55" text-anchor="middle" font-size="16" fill="#333">QQ / QQ空间</text>

  <!-- NapCat -->
  <rect x="440" y="120" width="220" height="80" rx="8" fill="#ECECFF" stroke="#9370DB" stroke-width="1.5"/>
  <text x="550" y="150" text-anchor="middle" font-size="16" fill="#333">NapCat · OneBot v11</text>
  <text x="550" y="175" text-anchor="middle" font-size="13" fill="#666">App PRoot · Linux QQ</text>

  <!-- qq-bot.js -->
  <rect x="440" y="240" width="220" height="80" rx="8" fill="#ECECFF" stroke="#9370DB" stroke-width="1.5"/>
  <text x="550" y="270" text-anchor="middle" font-size="16" fill="#333">qq-bot.js</text>
  <text x="550" y="295" text-anchor="middle" font-size="13" fill="#666">消息路由与标签拦截</text>

  <!-- services/ -->
  <rect x="120" y="370" width="240" height="120" rx="8" fill="#ECECFF" stroke="#9370DB" stroke-width="1.5"/>
  <text x="240" y="395" text-anchor="middle" font-size="16" fill="#333">services/ 模块群</text>
  <text x="240" y="420" text-anchor="middle" font-size="14" fill="#555">tts 声带 · music 点歌台</text>
  <text x="240" y="445" text-anchor="middle" font-size="14" fill="#555">vision 眼睛 · bili B站引擎</text>

  <!-- prompts/ -->
  <rect x="400" y="380" width="220" height="90" rx="8" fill="#ECECFF" stroke="#9370DB" stroke-width="1.5"/>
  <text x="510" y="405" text-anchor="middle" font-size="16" fill="#333">prompts/ 人格法则</text>
  <text x="510" y="430" text-anchor="middle" font-size="14" fill="#555">persona 双模板</text>
  <text x="510" y="455" text-anchor="middle" font-size="14" fill="#555">laws B站判定</text>

  <!-- tools/ -->
  <rect x="660" y="380" width="220" height="80" rx="8" fill="#ECECFF" stroke="#9370DB" stroke-width="1.5"/>
  <text x="770" y="405" text-anchor="middle" font-size="16" fill="#333">tools/ 手动工具</text>
  <text x="770" y="430" text-anchor="middle" font-size="14" fill="#555">push_diary · send_diary</text>

  <!-- Cloudflare Tunnel -->
  <rect x="200" y="400" width="180" height="60" rx="8" fill="#ECECFF" stroke="#9370DB" stroke-width="1.5"/>
  <text x="290" y="435" text-anchor="middle" font-size="16" fill="#333">Cloudflare Tunnel</text>

  <!-- server.js -->
  <rect x="440" y="520" width="220" height="90" rx="8" fill="#ECECFF" stroke="#9370DB" stroke-width="1.5"/>
  <text x="550" y="545" text-anchor="middle" font-size="16" fill="#333">server.js</text>
  <text x="550" y="568" text-anchor="middle" font-size="14" fill="#555">核心大脑</text>
  <text x="550" y="591" text-anchor="middle" font-size="14" fill="#555">记忆 / 情绪 / 日记</text>

  <!-- 网页控制台 -->
  <rect x="200" y="520" width="180" height="60" rx="8" fill="#ECECFF" stroke="#9370DB" stroke-width="1.5"/>
  <text x="290" y="555" text-anchor="middle" font-size="16" fill="#333">网页控制台 :3000</text>

  <!-- 云端大模型 -->
  <rect x="200" y="660" width="210" height="80" rx="8" fill="#ECECFF" stroke="#9370DB" stroke-width="1.5"/>
  <text x="305" y="685" text-anchor="middle" font-size="16" fill="#333">云端大模型</text>
  <text x="305" y="710" text-anchor="middle" font-size="14" fill="#555">多Provider 可切换</text>

  <!-- 本地兜底 -->
  <rect x="470" y="660" width="200" height="80" rx="8" fill="#ECECFF" stroke="#9370DB" stroke-width="1.5"/>
  <text x="570" y="685" text-anchor="middle" font-size="16" fill="#333">本地兜底</text>
  <text x="570" y="710" text-anchor="middle" font-size="14" fill="#555">8080 文本 · 8081 视觉</text>

  <!-- SQLite 记忆库 -->
  <rect x="730" y="660" width="190" height="80" rx="8" fill="#ECECFF" stroke="#9370DB" stroke-width="1.5"/>
  <text x="825" y="685" text-anchor="middle" font-size="16" fill="#333">SQLite 记忆库</text>
  <text x="825" y="710" text-anchor="middle" font-size="14" fill="#555">对话 / 日记 / 情绪</text>

  <!-- 连线 -->
  <line x1="550" y1="80" x2="550" y2="120" stroke="#555" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <line x1="550" y1="200" x2="550" y2="240" stroke="#555" stroke-width="1.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <polyline points="500,320 500,350 240,350 240,370" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="550" y1="320" x2="550" y2="380" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <polyline points="660,290 780,290 780,380" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <polyline points="440,290 90,290 90,560 440,560" fill="none" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="98" y="430" font-size="13" fill="#777">本地 HTTP :3000</text>
  <line x1="490" y1="610" x2="310" y2="658" stroke="#555" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="552" y1="610" x2="562" y2="658" stroke="#555" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arr)"/>
  <text x="575" y="640" font-size="13" fill="#777">云端全挂时降级</text>
  <line x1="660" y1="572" x2="732" y2="678" stroke="#555" stroke-width="1.5"/>
  <line x1="440" y1="555" x2="382" y2="555" stroke="#555" stroke-width="1.5"/>
  <line x1="290" y1="460" x2="290" y2="518" stroke="#555" stroke-width="1.5"/>
  <line x1="770" y1="460" x2="822" y2="658" stroke="#555" stroke-width="1.5"/>
</svg>